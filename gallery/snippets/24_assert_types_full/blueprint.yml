# blueprint.yml
# All Assert rule types in one pipeline.

aqueduct: "1.0"
id: assert_types_full
name: "Assert Types Demo"

modules:
  - id: raw_orders
    label: "Raw Orders"
    type: Ingress
    config:
      format: csv
      path: data/input/orders.csv
      options: {header: "true", inferSchema: "true"}

  - id: enriched
    label: "Enrich with tax"
    type: Channel
    config:
      op: sql
      query: "SELECT *, amount * 0.2 AS tax FROM raw_orders"

  - id: quality_gate
    label: "Quality Gate"
    type: Assert
    config:
      rules:
        - id: min_order_count
          type: min_rows
          min: 5
        - id: max_amount
          type: sql
          expr: "MAX(amount) <= 2000"
        - id: zero_spillway
          type: spillway_rate
          max: 0.0
        - id: non_null_id
          type: not_null
          column: order_id
          on_fail: abort
        - id: max_order_count
          type: max_rows
          max: 100
        - id: schema_check
          type: schema_match
          # order_id's own inferred type differs by engine — Spark's CSV
          # inferSchema picks IntegerType for values this small, DuckDB's
          # sniffer always picks BIGINT for any whole-number column,
          # regardless of value range. schema_match resolves the expected
          # type through the same type hub schema_hint uses: a fixed-width
          # numeric expectation ("int") is satisfied by an actual column at
          # least as wide in the same family, so "int" here validates on
          # both engines without an explicit CAST to force one engine's
          # inference to match the other's.
          expected:
            order_id: int
            customer: string
            amount: double
            status: string
            region: string
            tax: double
        - id: completed_max_check
          type: custom
          fn: rules.check_completed_max
          on_fail: quarantine

  - id: output
    label: "Save Result"
    type: Egress
    config:
      format: parquet
      path: data/output/orders.parquet
      mode: overwrite

  - id: quarantine_output
    label: "Quarantine Output"
    type: Egress
    config:
      format: parquet
      path: data/output/quarantine_output.parquet
      mode: overwrite

edges:
  - from: raw_orders
    to: enriched
  - from: enriched
    to: quality_gate
  - from: quality_gate
    to: output
  - from: quality_gate
    to: quarantine_output
    port: spillway
