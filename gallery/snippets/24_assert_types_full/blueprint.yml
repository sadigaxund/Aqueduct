# blueprint.yml
# All Assert rule types in one pipeline.

aqueduct: "1.0"
id: assert_types_full
name: "Assert Types Demo"

modules:
  - id: raw_orders
    label: "Raw Orders"
    type: Ingress
    config:
      format: csv
      path: data/input/orders.csv
      options: {header: "true", inferSchema: "true"}

  - id: enriched
    label: "Enrich with tax"
    type: Channel
    config:
      op: sql
      # order_id is explicitly CAST rather than left to each engine's own CSV
      # type-inference default: Spark's inferSchema picks IntegerType for
      # values this small, DuckDB's CSV sniffer always picks BIGINT for any
      # integer column — an engine difference upstream of Assert, not
      # something schema_match should paper over. Casting once here makes
      # order_id's type deterministic (and identical) on both engines, so
      # quality_gate's schema_match rule below checks a real, portable
      # contract instead of an inference accident.
      query: "SELECT CAST(order_id AS BIGINT) AS order_id, customer, amount, status, region, order_ts, amount * 0.2 AS tax FROM raw_orders"

  - id: quality_gate
    label: "Quality Gate"
    type: Assert
    config:
      rules:
        - id: min_order_count
          type: min_rows
          min: 5
        - id: max_amount
          type: sql
          expr: "MAX(amount) <= 2000"
        - id: zero_spillway
          type: spillway_rate
          max: 0.0
        - id: non_null_id
          type: not_null
          column: order_id
          on_fail: abort
        - id: max_order_count
          type: max_rows
          max: 100
        - id: schema_check
          type: schema_match
          expected:
            order_id: bigint
            customer: string
            amount: double
            status: string
            region: string
            tax: double
        - id: completed_max_check
          type: custom
          fn: rules.check_completed_max
          on_fail: quarantine

  - id: output
    label: "Save Result"
    type: Egress
    config:
      format: parquet
      path: data/output/orders.parquet
      mode: overwrite

  - id: quarantine_output
    label: "Quarantine Output"
    type: Egress
    config:
      format: parquet
      path: data/output/quarantine_output.parquet
      mode: overwrite

edges:
  - from: raw_orders
    to: enriched
  - from: enriched
    to: quality_gate
  - from: quality_gate
    to: output
  - from: quality_gate
    to: quarantine_output
    port: spillway
