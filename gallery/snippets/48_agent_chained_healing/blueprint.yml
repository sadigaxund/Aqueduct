# blueprint.yml
# Chained multi-patch healing demo, shipped in its HEALED
# state (this is what `aqueduct run` in CI exercises, LLM-free).
# `blueprint_bugged.yml` carries the two INDEPENDENT bugs this demo is
# built around, in two DIFFERENT Channels:
#
#   1. `priced`     references 'unit_cost'. The real column is 'unit_price'.
#   2. `discounted` (downstream of `priced`) filters on 'quantity'. The
#      real column is 'qty'.
#
# A loop that discarded a candidate whenever the pipeline still failed would
# re-diagnose bug #1 on every attempt: it patches `priced` in memory, re-runs,
# sees the pipeline still fail (now at `discounted`, bug #2), throws the
# candidate away, and starts over against the ORIGINAL unpatched Blueprint.
# Bug #1's fix is never carried forward.
#
# Chained healing fixes that: link 1 fixes `priced`, sees the
# NEXT failure surface at a DIFFERENT module (`discounted`) and folds link
# 1's fix into an accumulating patch instead of discarding it; link 2 then
# diagnoses `discounted` against the manifest with link 1's fix already
# applied. Nothing is written to disk until the full 2-op patch passes the
# pipeline end-to-end. See the README for that reader flow against
# `blueprint_bugged.yml`.

aqueduct: "1.0"
id: chained_healing_demo
name: "Chained Multi-Patch Healing"

agent:
  approval: auto
  # Chaining is the only heal-loop behavior, but it needs more than one
  # attempt to chain: max_patches is the single total-attempt cap.
  max_patches: 3
  # Chained healing is refused at heal-start unless sandbox_mode is not
  # 'off' (each chain link's advancement test IS the sandbox gate). 'sample'
  # is the default, set explicitly here so the requirement is visible.
  sandbox_mode: sample

modules:
  - id: raw_orders
    label: "Raw Orders"
    type: Ingress
    config:
      format: csv
      path: data/input/orders.csv
      options: {header: "true", inferSchema: "true"}

  - id: priced
    label: "Priced Lines"
    type: Channel
    config:
      op: sql
      # Healed: 'unit_price' is the real column (blueprint_bugged.yml has
      # the original 'unit_cost' bug the README's chained-healing
      # walkthrough exercises).
      query: "SELECT order_id, customer, qty, unit_price, qty * unit_price AS line_total FROM raw_orders"

  - id: discounted
    label: "Discounted Lines"
    type: Channel
    config:
      op: sql
      # Healed: 'qty' is the real column carried through `priced`
      # (blueprint_bugged.yml has the original 'quantity' bug).
      query: "SELECT order_id, customer, line_total, line_total * 0.9 AS discount_total FROM priced WHERE qty > 0"

  - id: output
    label: "Save Result"
    type: Egress
    config:
      format: parquet
      path: data/output/orders.parquet
      mode: overwrite

edges:
  - from: raw_orders
    to: priced
  - from: priced
    to: discounted
  - from: discounted
    to: output
