aqueduct_config: "2.0"

warnings:
  suppress:
    - "*"

deployment:
  engine: spark
  target: local

engine:
  spark:
    master_url: "local[*]"
    conf:
      spark.sql.catalogImplementation: hive

stores:
  observability:
    backend: duckdb
    path: .aqueduct

danger:
  allow_full_probe_actions: true