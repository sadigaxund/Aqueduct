aqueduct_config: "2.0"

warnings:
  suppress:
    - "*"

# aqueduct.yml
deployment:
  engine: spark
  target: local

engine:
  spark:
    master_url: "local[*]"
    conf:
      # JDBC drivers for PostgreSQL and SQLite
      spark.jars.packages: "org.postgresql:postgresql:42.5.0,org.xerial:sqlite-jdbc:3.36.0.3"

stores:
  observability:
    backend: duckdb
    path: .aqueduct
