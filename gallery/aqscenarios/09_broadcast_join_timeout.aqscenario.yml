aqueduct_scenario: "1.0"

id: broadcast_join_timeout
description: >
  Channel joins two tables and hints a broadcast on the large
  table (orders). The broadcast fails because the table exceeds the
  threshold. Two fixes are legitimate — remove the broadcast hint, or adjust
  spark.sql.autoBroadcastJoinThreshold — but only the second is gradeable
  here; see the expectation block.
blueprint: blueprints/09_broadcast_join_timeout.yml

# Both, like scenario 07: the error text names two legitimate fixes and the
# domain is a property of the FIX, not of the failure.
domains: [engine_config, pipeline]

inject_failure:
  module: join_enriched
  error_message: |
    org.apache.spark.SparkException: Could not execute broadcast in 300 secs.
    You can increase the timeout for broadcasts via spark.sql.broadcastTimeout
    or disable broadcast join by setting spark.sql.autoBroadcastJoinThreshold to -1.
    Cannot broadcast the table that is larger than 8GB: 12.4 GB.
    at org.apache.spark.sql.execution.exchange.BroadcastExchangeExec$$anon$1.run(BroadcastExchangeExec.scala:134)
    at org.apache.spark.sql.execution.exchange.BroadcastExchangeExec$$anon$1.run(BroadcastExchangeExec.scala:128)
    ...
    Driver stacktrace:
      at org.apache.spark.scheduler.DAGScheduler.failJobAndIndependentStages(DAGScheduler.scala:3083)
    Caused by: java.util.concurrent.TimeoutException
      at java.util.concurrent.FutureTask.get(FutureTask.java:205)
  structured:
    error_class: SPARK_BROADCAST_TIMEOUT
    object_name: null
    suggested_columns: []
    root_exception:
      type: org.apache.spark.SparkException
      message: "Cannot broadcast the table that is larger than 8GB: 12.4 GB"

# This block used to read `config_contains: {query: ""}` — an empty-string
# substring against a Channel that already HAS a `query`, so it asserted only
# that a key which was never absent is still present. Scenario 07 had the same
# defect in a different spelling; both passed for every patch ever generated.
#
# The error text names two legitimate fixes and this grades both. It briefly
# graded only the config route, because the grammar had no way to say "the hint
# is GONE" — every matcher asked whether a substring was PRESENT. Three live
# benchmark runs then took the hint-removal route three times out of three,
# produced a correct patch each time, and were scored FAIL. A benchmark that
# fails the answer a model actually gives is worse than one that is merely
# incomplete, so `config_not_contains` was added rather than shipping that.
#
# `engine_config_changed` rather than a pinned value: -1 (disable) and a raised
# byte threshold are both correct, and which one is right depends on the
# cluster. Gate 1 refuses a write whose effective config is identical before
# and after, so "the key moved" cannot be satisfied by rewriting what is there.
expected_patch:
  effect:
    any_of:
      - engine_config_changed:
          spark: [spark.sql.autoBroadcastJoinThreshold]
      # The hint is gone AND the join survived. `config_not_contains` alone
      # would pass for a patch that deleted the whole query, so the positive
      # half is what keeps this from grading vandalism as a fix. A table name
      # rather than a SQL fragment: `config_contains` normalises SQL-typed
      # keys through sqlglot, and a fragment that is not parseable on its own
      # (`JOIN customers_raw`) normalises to something that no longer matches.
      - module: join_enriched
        config_not_contains:
          query: "BROADCAST"
        config_contains:
          query: "customers_raw"

assertions:
  - patch_is_valid: true
  - patch_applies: true
  - root_cause_contains: ["broadcast", "timeout", "hint"]
