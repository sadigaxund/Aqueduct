aqueduct_scenario: "1.0"

id: spark_oom_shuffle
description: >
  Large join triggers executor OOM because shuffle partitions are set too low
  (10 partitions for a large dataset). The agent must increase
  spark.sql.shuffle.partitions or insert a repartition step to distribute the
  join load across more tasks.
blueprint: blueprints/07_spark_oom_shuffle.yml

# Both, on purpose. The domain is a property of the FIX, not of the failure,
# and this failure has two legitimate fixes: raise the shuffle-partition count
# (engine_config) or add a repartition Channel ahead of the join (pipeline).
# Declaring one would assert the answer this scenario exists to test.
domains: [engine_config, pipeline]

inject_failure:
  module: join_and_aggregate
  error_message: |
    org.apache.spark.SparkException: Job aborted due to stage failure:
    Task 0 in stage 3.0 failed 4 times, most recent failure:
    Lost task 0.3 in stage 3.0 (TID 7) (10.0.0.5 executor 2):
    ExecutorLostFailure (executor 2 exited caused by one of the running tasks)
    Reason: Container killed by YARN for exceeding memory limits.
    10.4 GB of 10 GB physical memory used.
    Consider boosting spark.executor.memory or enabling spark.memory.offHeap.enabled.
    ...
    Driver stacktrace:
      at org.apache.spark.scheduler.DAGScheduler.failJobAndIndependentStages(DAGScheduler.scala:3083)
    Caused by: org.apache.spark.sql.shuffle.sort.SortShuffleManager: Too large frame
      at org.apache.spark.sql.execution.exchange.ShuffleExchangeExec.mapOutputStatistics(ShuffleExchangeExec.scala:189)
  structured:
    error_class: SPARK_EXECUTOR_OOM
    object_name: null
    suggested_columns: []
    root_exception:
      type: org.apache.spark.SparkException
      message: "Container killed by YARN for exceeding memory limits. 10.4 GB of 10 GB physical memory used."

# The expectation grades the FIX, not the survival of the module. This block
# used to read `effect: {module: join_and_aggregate}`, which asserted only
# that a module the patch never touched still existed — so the scenario passed
# for every patch, including one that changed nothing relevant.
#
# `engine_config_changed` rather than a pinned partition count: the right
# number is a property of the cluster this would run on, which nothing here
# can see, so pinning one would fail a correct heal on a differently-sized
# deployment. The gate that a change is REAL is already enforced elsewhere —
# Gate 1 refuses a write whose effective config is identical before and after
# (`aqueduct/patch/config_delta.py`), so "the key moved" cannot be satisfied
# by re-writing the value the Blueprint already carries.
expected_patch:
  effect:
    any_of:
      - engine_config_changed:
          spark: [spark.sql.shuffle.partitions]
      - modules_contain:
          type: Channel
          config_contains:
            op: repartition

assertions:
  - patch_is_valid: true
  - patch_applies: true
  - root_cause_contains: ["OOM", "shuffle", "memory", "partitions"]
