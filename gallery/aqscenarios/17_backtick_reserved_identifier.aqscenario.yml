aqueduct_scenario: "1.0"

id: backtick_reserved_identifier
description: >
  activity_raw carries a real column literally named `user`. clean_activity's
  SQL references it bare — USER is a reserved keyword in Spark's ANSI SQL
  grammar (spark.sql.ansi.enabled defaults true on Spark 4), so the parser
  rejects it before the query is ever resolved. The heal must backtick-quote
  the identifier, not rename or drop the column.
blueprint: blueprints/17_backtick_reserved_identifier.yml

# The fix is a Blueprint edit — a module's config, not an engine knob.
domains: [pipeline]

inject_failure:
  module: clean_activity
  error_message: |
    pyspark.errors.exceptions.captured.ParseException: [PARSE_SYNTAX_ERROR] Syntax error at or near 'user'. SQLSTATE: 42601
    == SQL (line 3, position 3) ==
          id,
          user,
          ^^^^
          action,
          ts

expected_patch:
  effect:
    module: clean_activity
    config_contains:
      query: "`user`"   # raw substring — sqlglot cannot parse backticks under the default dialect, so this compares literally

assertions:
  - patch_is_valid: true
  - patch_applies: true
  - root_cause_contains: ["user", "reserved", "syntax"]
