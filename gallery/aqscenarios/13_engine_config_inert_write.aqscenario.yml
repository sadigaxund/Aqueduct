aqueduct_scenario: "1.0"

id: engine_config_inert_write
description: >
  The Blueprint already pins spark.sql.shuffle.partitions at 200 and the
  engine's error text recommends 200. A model that echoes the recommendation
  writes the value that already resolves: allowlist-clean, schema-valid,
  applies without complaint, and changes nothing any engine would see.

  This scenario PASSES when the model declines to echo it and heals with a key
  that actually moves. The distinction from scenario 12 survives the inversion:
  there the trap is a forbidden KEY, here it is a useless VALUE, and the two
  need different fixes — a different key, or a different value.
blueprint: blueprints/13_engine_config_inert_write.yml

domains: [engine_config]

inject_failure:
  module: join_returns
  engine: spark
  error_message: |
    org.apache.spark.SparkException: Job aborted due to stage failure:
    Task 17 in stage 5.0 failed 4 times, most recent failure:
    Lost task 17.3 in stage 5.0 (TID 244) (10.0.0.9 executor 4):
    ExecutorLostFailure (executor 4 exited caused by one of the running tasks)
    Reason: Container killed on request. Exit code is 143
      at org.apache.spark.scheduler.DAGScheduler.failJobAndIndependentStages(DAGScheduler.scala:3083)
    Shuffle write for this stage was skewed across too few reducers.
    Consider setting spark.sql.shuffle.partitions to 200.
  structured:
    error_class: SPARK_EXECUTOR_LOST
    object_name: null
    suggested_columns: []
    root_exception:
      type: org.apache.spark.SparkException
      message: "Container killed on request. Exit code is 143"

# ⚠ INVERTED 2026-08-15, for the same reason as scenario 12 and on the same
# evidence — see that file for the full argument. This used to assert
# `patch_applies: false` + `patch_refused: inert` + `gate_status: fail`, which
# required the model to ECHO the engine's recommendation back at a Blueprint
# that already carried it. It did not: shown this failure, the model proposed
# `spark.executor.memoryOverhead`, which is the canonical fix for a container
# killed with exit code 143 (a YARN physical-memory kill), and deliberately did
# not restate the 200 that was already configured.
#
# The inert refusal keeps its deterministic coverage in the suites over
# `patch/config_delta.py` — `EngineConfigInertError` is raised there by a
# write-target probe, not sampled from a model's behaviour.
#
# `gate_status: pass` is doing real work here rather than restating
# `patch_applies`. The delta gate is precisely what an inert write fails, so a
# model that DID echo 200 would apply-and-refuse with `fail`, and a model that
# wrote some other key at its existing value would too. Requiring `pass` is
# requiring a write that changes what the engine sees.
expected_patch:
  effect:
    any_of:
      - engine_config_changed:
          spark: [spark.executor.memoryOverhead]
      - engine_config_changed:
          spark: [spark.executor.memory]

assertions:
  - patch_is_valid: true
  - patch_applies: true
  - gate_status: {engine_config: pass}
  - root_cause_contains: ["shuffle", "partitions", "skew"]
