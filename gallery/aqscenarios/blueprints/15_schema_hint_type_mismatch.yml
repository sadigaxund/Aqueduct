aqueduct: "1.0"
id: pipeline
name: Pipeline
# Defect (for scenario 15): orders_raw declares schema_hint amount: int, but
# the CSV amount column carries decimal values ("19.99") — Spark infers
# double, so the declared hint mismatches the actual inferred type.
modules:
  - id: orders_raw
    type: Ingress
    label: Raw Orders
    config:
      format: csv
      path: data/input/orders.csv
      options:
        header: "true"
        inferSchema: "true"
      schema_hint:
        order_id: string
        amount: int
        order_date: date
  - id: clean_orders
    type: Channel
    label: Clean Orders
    config:
      op: sql
      query: |
        SELECT
          order_id,
          amount,
          order_date
        FROM orders_raw
edges:
  - from: orders_raw
    to: clean_orders
