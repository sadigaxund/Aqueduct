# DuckDB engine capability declaration — DATA, not code (Phase 78 Stage A,
# honesty rework at checkpoint 3b).
#
# One explicit row per capability leaf, earned leaf by leaf against a real
# handler + test — NOT copied from spark/capabilities.yml. See that file's
# header for the shape (`support:` plus optional `requires:` / `hint:`).
#
# Verdicts: supported | unsupported | ignored_with_warning | undeclared
#
# A `supported` verdict answers one question: "if a Blueprint uses this leaf
# on engine=duckdb, what happens?" Two honest senses of `supported`, both
# requiring proof, not a guess:
#   - EXECUTION leaves (channel.op.*, ingress.format.*, egress.format.*,
#     egress.mode.*, egress.on_new_columns.*, junction.mode.*, funnel.mode.*,
#     module.type.*, feature.*): `supported` only with a real handler AND a
#     test exercising it on DuckDB.
#   - ENGINE-INVARIANT grammar leaves (agent.*, hooks.*, retry_policy.*,
#     backoff.*, edge.*, udf.field.*, module.field.*, warnings.*): `supported`
#     because core orchestration handles them identically regardless of
#     engine and the executor never touches them — proven by end-to-end
#     tests, not assumed.
#
# Q4 STEP 2 (see AGENTS.md + docs/specs.md §10.9): the CHECKLIST below only
# ever lists ENGINE-SCOPED `config.*` leaves (those genuinely dispatch
# through an engine — probes.*, metrics.use_observe, timezone,
# checkpoint_root, deployment.target/databricks.*, handoff.root,
# agent.sandbox_master_url, agent.block_on_explain_regression,
# danger.allow_full_probe_actions). CORE config leaves (config.webhooks.*,
# config.secrets.*, config.stores.*, config.lineage.*, most of
# config.agent.*/config.danger.*, ...) never appear here at all — no engine
# declares a verdict for them, because they run in core code paths with no
# per-engine implementation to diverge from. `config.lineage.*` was
# corrected to CORE 2026-07-31: OpenLineage emission is built in
# `Surveyor.__init__` gated only on `openlineage_url`, with no engine
# condition — a DuckDB run emits OpenLineage events exactly like Spark, so
# the two `ignored_with_warning` rows this file used to carry for
# `lineage.openlineage_url`/`openlineage_namespace` were false claims and
# are now gone. `engine.spark.*` leaves are Spark's own and never appear
# here either — positionally owned by exactly one engine.
#
# STAGE A scope (see AGENTS.md maintenance playbook + the Phase 78 brief):
#   Ingress:  read_parquet / read_csv / read_json only.
#   Channel:  sql + join (sqlglot spark->duckdb transpile), filter, select,
#             deduplicate, cast, rename, sort, union — each has a real
#             handler and a DuckDB test. repartition/coalesce/cache are
#             Spark physical-partitioning/distributed-cache hints with no
#             DuckDB equivalent — honestly UNSUPPORTED, not silently faked.
#   Junction: all three modes (conditional/broadcast/partition) are pure
#             filters over a single-node relation — cheap, implemented.
#   Funnel:   union_all / union (SQL UNION [ALL]) and coalesce / zip
#             (row-aligned joins keyed on a synthetic row id) — all four
#             have a real handler and a DuckDB test.
#   Egress:   COPY ... TO parquet/csv. overwrite/error/errorifexists/ignore
#             are native COPY modes; append is a non-atomic read-existing +
#             UNION ALL BY NAME + rewrite workaround (see the leaf's hint).
#   Assert:   ALL 10 rule types (the 9 in spark/assert_.py's AssertRuleType
#             plus null_rate) and all 5 on_fail actions (abort/warn/webhook/
#             quarantine/trigger_agent) — every rule is a SQL aggregate or a
#             boolean/filter expression, which DuckDB does natively. sql/
#             sql_row expressions are sqlglot-transpiled Spark SQL -> DuckDB
#             SQL, same idiom as Channel op: sql. Quarantine reuses the
#             feature.spillway machinery (Channel's spillway_condition path)
#             rather than a second mechanism. custom resolves fn: through
#             infra/module_loading.load_callable, never a bare import.
#   UDFs:     lang: java is Spark-only (unsupported). DuckDB Python UDFs are
#             vectorized and semantically different from Spark's row UDFs —
#             not implemented/tested this stage, so unsupported honestly
#             rather than silently wrong.
#   Probe (Pass F): 8 of Spark's 9 built-in signals plus custom — each a SQL
#             aggregate/sample query or metadata read (see duckdb_/probe.py).
#             row_count_estimate is EXACT here (parquet footer for a direct
#             Ingress tap, COUNT(*) otherwise), never an estimate — the
#             Spark rationale for sampling it does not transfer to a
#             single-node exact count. partition_stats stays unsupported —
#             no partition concept on a single-process engine.
#   Egress on_new_columns (Pass F): allow/alert/fail, implemented as a
#             zero-scan LIMIT 0 metadata read against the existing target
#             before write — see egress.py's _enforce_on_new_columns.
#   Iceberg / Hudi / Kafka / custom DataSource / Databricks deployment: all
#   Spark-specific, not applicable to DuckDB at all.
#   Delta / JDBC / Depot ingress+egress, egress.mode.overwrite_partitions,
#   feature.{delta_write,delta_time_travel,parallel_mode}: DEFERRED —
#   implementable on DuckDB (delta-rs / postgres scanner / httpfs /
#   per-thread cursor, see each leaf's hint) but deliberately left out of
#   Stage A scope. Grouped in their own comment blocks below so the verdict
#   flip is a one-line edit per leaf once a later stage picks one up.

engine: duckdb

leaves:
  # ── Healing-agent config (engine-independent — the agent layer doesn't
  # touch engine internals; DuckDB honors the same knobs Spark does) ───────
  agent.field.allow_defer: supported
  agent.field.api_key: supported
  agent.field.approval_mode: supported
  agent.field.base_url: supported
  agent.field.block_on_explain_regression:
    support: unsupported
    hint: "block_on_explain_regression relies on Spark's explain()-plan snapshot gate (aqueduct.patch.explain_gate); DuckDB has no equivalent plan-snapshot capture implemented."
  agent.field.cascade: supported
  agent.field.confidence_threshold: supported
  agent.field.deep_loop: supported
  agent.field.guardrails: supported
  agent.field.max_chain: supported
  agent.field.max_heal_attempts_per_hour: supported
  agent.field.max_patches: supported
  agent.field.max_reprompts: supported
  agent.field.max_tool_calls: supported
  agent.field.mode: supported
  agent.field.model: supported
  agent.field.on_heal_failure: supported
  agent.field.on_pending_patches: supported
  agent.field.patch_validation: supported
  agent.field.progressive: supported
  agent.field.prompt_context: supported
  agent.field.provider: supported
  agent.field.provider_options: supported
  agent.field.regression_artifact: supported
  agent.field.sandbox_mode: supported
  agent.field.supports_tools: supported
  agent.field.timeout: supported
  agent_cascade_tier.field.allow_defer: supported
  agent_cascade_tier.field.api_key: supported
  agent_cascade_tier.field.base_url: supported
  agent_cascade_tier.field.deep_loop: supported
  agent_cascade_tier.field.max_reprompts: supported
  agent_cascade_tier.field.max_seconds: supported
  agent_cascade_tier.field.max_tokens: supported
  agent_cascade_tier.field.model: supported
  agent_cascade_tier.field.provider: supported
  agent_cascade_tier.field.provider_options: supported
  agent_cascade_tier.field.supports_tools: supported
  agent_cascade_tier.field.timeout: supported
  agent_guardrails.field.allowed_paths: supported
  agent_guardrails.field.forbidden_ops: supported
  agent_guardrails.field.heal_on_errors: supported
  agent_guardrails.field.never_heal_errors: supported
  backoff.field.base_seconds: supported
  backoff.field.jitter: supported
  backoff.field.max_seconds: supported
  backoff.field.strategy: supported

  # ── Channel ops — Stage A scope: sql, join, filter, select, deduplicate,
  # cast, rename, sort, union (each has a real handler + a DuckDB test) ────
  channel.op.cache:
    support: unsupported
    hint: "op=cache maps to Spark's distributed persist(StorageLevel); DuckDB is single-process with no distributed cache tier to spill to. Not implemented."
  channel.op.cast:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_channel_cast
  channel.op.coalesce:
    support: unsupported
    hint: "op=coalesce is a Spark physical-partition-count hint; DuckDB has no partition concept to coalesce. Not applicable."
  channel.op.deduplicate:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_channel_deduplicate_no_key
  channel.op.filter:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_channel_filter
  channel.op.join:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_channel_join
  channel.op.rename:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_channel_rename
  channel.op.repartition:
    support: unsupported
    hint: "op=repartition is a Spark physical-partition-count hint; DuckDB has no partition concept to repartition. Not applicable."
  channel.op.select:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_channel_select
  channel.op.sort:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_channel_sort
  channel.op.sql:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_channel_sql_transpiled_from_spark_dialect
  channel.op.union:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_channel_union

  # ── Engine config (aqueduct.yml) ─────────────────────────────────────────
  config.agent.block_on_explain_regression:
    support: unsupported
    hint: "relies on the Spark explain()-plan snapshot gate; no DuckDB equivalent implemented."
  config.agent.sandbox_master_url:
    support: unsupported
    hint: "sandbox_master_url pins a Spark master URL for the patch-preview sandbox session; DuckDB has no cluster master to pin (single-process, always local)."
  config.checkpoint_root: supported
  config.danger.allow_full_probe_actions:
    support: supported
    hint: "Inverted into block_full_actions and threaded into the DuckDB executor's Probe dispatch (Pass F) — genuinely gates null_rates/value_distribution/distinct_count/data_freshness (unless allow_sample). row_count_estimate and threshold are NOT gated on this engine — see duckdb_/probe.py's module docstring for why an exact single-node count and the Regulator-gate signal are never blocked."
    tests:
      - tests/test_executor_duckdb/test_probe.py::test_config_danger_allow_full_probe_actions_gates_via_block_full_actions
      - tests/test_executor_duckdb/test_probe.py::test_row_count_estimate_not_gated_by_block_full_actions
      - tests/test_executor_duckdb/test_probe.py::test_threshold_not_gated_by_block_full_actions
  config.deployment.databricks.cluster_id:
    support: unsupported
    hint: "single-node engine — schedule the container on one node. Databricks is a Spark deployment target."
  config.deployment.databricks.libraries:
    support: unsupported
    hint: "single-node engine — schedule the container on one node. Databricks is a Spark deployment target."
  config.deployment.databricks.max_concurrent_runs:
    support: unsupported
    hint: "single-node engine — schedule the container on one node. Databricks is a Spark deployment target."
  config.deployment.databricks.new_cluster:
    support: unsupported
    hint: "single-node engine — schedule the container on one node. Databricks is a Spark deployment target."
  config.deployment.databricks.workspace_url:
    support: unsupported
    hint: "single-node engine — schedule the container on one node. Databricks is a Spark deployment target."
  config.deployment.target:
    support: supported
    hint: "DuckDB is a single-node engine — only target=local is meaningful. Remote-submit / cluster targets (databricks, emr, dataproc, yarn, kubernetes, standalone) have no DuckDB execution path; use the spark engine for those."
  config.engine.duckdb.database_path:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_engine_config.py::TestMakeSessionDatabasePath::test_database_path_persists_across_sessions
      - tests/test_executor_duckdb/test_engine_config.py::TestMakeSessionDatabasePath::test_unset_database_path_is_memory_only
  config.engine.duckdb.extension_repository:
    support: supported
    hint: "SET custom_extension_repository, applied before any extension install — the airgapped/hermetic-CI escape hatch for the first s3://-style path a Blueprint touches (DuckDB's own httpfs extension autoinstalls over the network otherwise). See also a pre-populated ~/.duckdb/extensions, which needs no config at all."
    tests:
      - tests/test_executor_duckdb/test_engine_config.py::TestEnsureExtension::test_ensure_extension_sets_custom_repository_before_install
  config.engine.duckdb.memory_limit:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_engine_config.py::TestMakeSessionMemoryAndThreads::test_memory_limit_applied
  config.engine.duckdb.s3_key_id_secret:
    support: supported
    hint: "A secret KEY NAME, resolved through the configured secrets: provider (same aqueduct.secrets.resolve_secret() @aq.secret() uses) and fed into DuckDB's own CREATE SECRET (TYPE S3, ...) via parameter binding — never a literal credential in aqueduct.yml, never string-interpolated into SQL."
    tests:
      - tests/test_executor_duckdb/test_engine_config.py::TestS3SecretResolution::test_make_session_wires_s3_secret_via_engine_options
  config.engine.duckdb.s3_region:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_engine_config.py::TestS3SecretResolution::test_configure_s3_secret_creates_duckdb_secret_no_network
  config.engine.duckdb.s3_secret_access_key_secret:
    support: supported
    hint: "A secret KEY NAME — see config.engine.duckdb.s3_key_id_secret. Must be set together with it."
    tests:
      - tests/test_executor_duckdb/test_engine_config.py::TestS3SecretResolution::test_make_session_wires_s3_secret_via_engine_options
  config.engine.duckdb.threads:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_engine_config.py::TestMakeSessionMemoryAndThreads::test_threads_applied
  config.handoff.root:
    support: supported
    hint: "A remote handoff.root (s3://, gs://, ...) is reached the same way any other remote path is on this engine — DuckDB's httpfs extension, autoloaded on first touch, plus engine.duckdb.s3_* credentials if the target requires authentication. Not reachable before httpfs work landed; now genuinely probed (aqueduct doctor's handoff-access:duckdb check attempts a real round trip, no longer a blanket skip)."
  config.metrics.use_observe:
    support: unsupported
    hint: "use_observe toggles Spark's Observation API (a SparkListener-driven zero-cost row-count mechanism); DuckDB has no equivalent listener hook. This engine does not yet collect per-module runtime metrics (rows/bytes) outside the Handoff module at all (see executor/models.py's module_metrics writer), so there is no existing collection path for this flag to toggle either way — the key is inert here, not superseded by an always-on alternative."
  config.probes.default_sample_fraction:
    support: supported
    hint: "Genuinely consumed by the DuckDB Probe implementation (Pass F, duckdb_/probe.py's ProbeSampling) — the default fraction for null_rates/value_distribution/distinct_count/data_freshness sampled queries when a signal omits its own fraction:."
    tests:
      - tests/test_executor_duckdb/test_probe.py::test_config_probes_sampling_knobs_threaded_through_execute
  config.probes.max_sample_rows:
    support: supported
    hint: "Genuinely consumed by the DuckDB Probe implementation (Pass F) — caps sample_rows' n: regardless of what a signal requests."
    tests:
      - tests/test_executor_duckdb/test_probe.py::test_config_probes_sampling_knobs_threaded_through_execute
      - tests/test_executor_duckdb/test_probe.py::test_sample_rows_capped_by_max_sample_rows
  config.timezone: supported

  # ── Edges / spillway routing — pure filters, engine-independent ─────────
  edge.field.error_types: supported
  edge.field.from_id: supported
  edge.field.port: supported
  edge.field.to: supported

  # ── Egress formats/modes — Stage A scope: parquet/csv (ungated formats)
  # via COPY ... TO; only write modes COPY can express natively ───────────
  egress.format.custom:
    support: unsupported
    hint: "format: custom is the pyspark>=4.0 Python DataSource registry — Spark-only. Not applicable to DuckDB."
  egress.format.hudi:
    support: unsupported
    hint: "Hudi is not implemented for the DuckDB engine."
  egress.format.iceberg:
    support: unsupported
    hint: "Iceberg is not implemented for the DuckDB engine."
  egress.mode.append:
    support: supported
    hint: "Implemented as a NON-ATOMIC read-existing + UNION ALL BY NAME + rewrite (DuckDB's COPY ... TO has no native append). A crash mid-rewrite can lose the prior file, and two concurrent appenders race — acceptable for single-process local batch, not a substitute for a transactional sink."
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_write_egress_append_to_existing_target_unions_rows
  egress.mode.error:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_write_egress_error_mode_existing_target_raises
  egress.mode.errorifexists:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_write_egress_errorifexists_mode_existing_target_raises
  egress.mode.ignore:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_write_egress_ignore_mode_existing_target_skips_write
  egress.mode.merge:
    support: unsupported
    hint: "mode=merge (upsert) requires a target table format with a transaction log (Delta). Not implemented for DuckDB."
  egress.mode.overwrite:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_write_egress_parquet_overwrite

  # ── on_new_columns (Pass F) — a zero-scan LIMIT 0 metadata read against the
  # existing target's schema before write; see egress.py's
  # _enforce_on_new_columns for the full write contract. ─────────────────────
  egress.on_new_columns.alert:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_write_egress_on_new_columns_alert_warns_and_absorbs
  egress.on_new_columns.allow:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_write_egress_on_new_columns_allow_absorbs_silently
  egress.on_new_columns.fail:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_write_egress_on_new_columns_fail_raises_when_new_column_added

  # ── DEFERRED (Stage B candidates) — provisionally unsupported. DuckDB can
  # implement each of these; they were deliberately left out of Stage A scope
  # rather than rushed. Grouped here so the verdict flip is a one-line edit
  # per leaf once a later stage picks them up. ──────────────────────────────
  egress.mode.overwrite_partitions:
    support: unsupported
    hint: "Requires COPY ... TO with PARTITION_BY plus pruning the target partition directories before write. Not implemented."
  egress.format.delta:
    support: unsupported
    hint: "Requires a delta-rs bridge (the deltalake Python package writes a Delta log DuckDB has no writer for). Not implemented."
  egress.format.depot:
    support: supported
    hint: "format: depot writes a single KV entry via the DepotStore Python interface (depot.put(key, value)) — a plain Python call, engine-independent, never routed through this engine's own SQL/relation layer. value_expr opts into a single DuckDB aggregate query (rel.aggregate(expr).fetchone()), mirroring Spark's single .collect() action."
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_write_egress_format_depot_value
      - tests/test_executor_duckdb/test_executor.py::test_write_egress_format_depot_value_expr

  # ── Feature flags ─────────────────────────────────────────────────────────
  feature.broadcast_junction:
    support: unsupported
    hint: "broadcast_junction names a Spark distributed-join optimization; DuckDB is single-process, so there is nothing to broadcast. junction.mode.broadcast (fan-out to identical branches) is unaffected and supported."
  feature.checkpoint:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_feature_checkpoint_driven_through_execute
  feature.custom_datasource:
    support: unsupported
    hint: "Custom Python DataSource is a pyspark>=4.0 API — Spark-only."
  feature.java_udf:
    support: unsupported
    hint: "lang: java UDFs require a JVM UDF registry (Spark-only). Not applicable to DuckDB."
  feature.metrics_boundary:
    support: unsupported
    hint: "metrics_boundary works around Spark's stage-fusion by forcing a shuffle boundary so SparkListener attributes metrics per module — a fix for a problem specific to that collection mechanism. DuckDB has no stage-fusion concept to work around, but this engine's executor does not yet collect per-module runtime metrics (rows/bytes) at all outside the Handoff module (see executor/models.py's module_metrics writer), so there is no per-module attribution for this flag to configure either way."
  feature.python_udf:
    support: supported
    hint: "conn.create_function(name, fn, parameters=None, return_type) defaults to NATIVE (row-at-a-time) execution, matching Spark's UDF semantics — measured: a per-row call log shows one call per input row, not a batch. null_handling='special' is set explicitly (DuckDB's own default silently skips the call on a NULL argument instead of invoking the function — measured, the opposite of Spark's always-call behavior). Exception propagation is DuckDB's default (an uncaught exception aborts the query, matching Spark). return_type renders through the same Arrow type hub as schema_hint/schema_match. Parameterized (factory) UDFs via params: are supported, same contract as Spark. deterministic maps onto DuckDB's side_effects (inverted) — Spark's own udf.py never reads this field either, so this is a strict improvement, not a divergence. lang: java/scala UDFs stay unsupported — see feature.java_udf; DuckDB is not on the JVM."
    tests:
      - tests/test_executor_duckdb/test_udf.py::test_successful_registration_and_call
      - tests/test_executor_duckdb/test_udf.py::test_row_at_a_time_not_batched
      - tests/test_executor_duckdb/test_udf.py::test_null_argument_still_calls_function
      - tests/test_executor_duckdb/test_udf.py::test_exception_in_udf_propagates
      - tests/test_executor_duckdb/test_udf.py::test_parameterized_udf_factory
  feature.spillway:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_feature_spillway_driven_through_execute
  feature.table_addressing:
    support: unsupported
    hint: "DuckDB Ingress/Egress require format:+path: — measured: DuckDB DOES have a real catalog (memory.main, system.main/information_schema/pg_catalog, plus whatever ATTACH adds), so a three-part catalog.schema.table namespace genuinely exists. What is missing is an IMPLEMENTATION mapping a Blueprint's bare table: name onto it (which catalog/schema to default to, whether ATTACH is required first) — not the absence of a catalog. Use format:+path: instead of table: addressing on this engine until that mapping is built."

  # ── DEFERRED (Stage B candidates) — see the Egress deferred block above
  # for the grouping rationale; same "one-line flip later" intent. ─────────
  feature.delta_time_travel:
    support: unsupported
    hint: "Requires a delta-rs bridge (the deltalake Python package can read a Delta table's transaction log at a given version/timestamp). Not implemented."
  feature.delta_write:
    support: unsupported
    hint: "Requires a delta-rs bridge (the deltalake Python package writes a Delta log DuckDB has no writer for). Not implemented."
  feature.parallel_mode:
    support: unsupported
    hint: "Requires a Python ThreadPoolExecutor over independent DAG subtrees. Measured: a single DuckDBPyConnection object is NOT safe for concurrent queries from multiple threads — two threads calling .sql() on the SAME connection object concurrently raise 'Invalid Input Error: Attempting to execute an unsuccessful or closed pending query result'. Each thread needs its OWN cursor (con.cursor()), which IS safe for concurrent reads — a real but small additional wiring cost this engine has not built yet. Not implemented: the executor runs the topological order serially today."

  # ── Funnel modes — Stage A scope: union_all, union, coalesce, zip (each
  # has a real handler + a DuckDB test) ────────────────────────────────────
  funnel.mode.coalesce:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_funnel_coalesce_folds_overlapping_columns
  funnel.mode.union:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_funnel_union_dedupes
  funnel.mode.union_all:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_funnel_union_all
  funnel.mode.zip:
    support: supported
    tests:
      - tests/test_executor_duckdb/test_executor.py::test_funnel_zip_row_aligned_join

  # ── Self-heal provenance (Phase 79) — compiler-consumed metadata only, no
  # engine executes this block, so it is trivially supported everywhere ────
  healed_by.field.applied_at:
    support: supported
    hint: Compiler-consumed provenance metadata — no engine executes it.
  healed_by.field.classification:
    support: supported
    hint: Compiler-consumed provenance metadata — no engine executes it.
  healed_by.field.engine:
    support: supported
    hint: Compiler-consumed provenance metadata — no engine executes it.
  healed_by.field.engine_version:
    support: supported
    hint: Compiler-consumed provenance metadata — no engine executes it.
  healed_by.field.patch_id:
    support: supported
    hint: Compiler-consumed provenance metadata — no engine executes it.
  healed_by.field.run_id:
    support: supported
    hint: Compiler-consumed provenance metadata — no engine executes it.
  healed_by.field.validated_on:
    support: supported
    hint: Compiler-consumed provenance metadata — no engine executes it.

