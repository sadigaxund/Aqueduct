  # Incremental Channel watermark (2.40) — promoted out of the freeform
  # `config:` dict to declared module fields so the capability framework can
  # see them (see AGENTS.md's capability-leaf workflow). This is the exact
  # defect that used to ship silently: `${ctx._watermark}` reached
  # duckdb_/channel.py's sqlglot transpile unsubstituted and raised a
  # confusing ParseError, with the real cause (materialize/watermark_column
  # were freeform config keys, invisible to any gate) documented as a known
  # gap in this module's own docstring instead of fixed. Fixed 2.40 —
  # executor.py's Channel branch now runs the same read -> substitute -> run
  # -> persist-new-max cycle Spark's executor runs, in DuckDB's own idiom
  # (SQL aggregate instead of a DataFrame action). `tests:` added
  # voluntarily (not required for a module.field.* leaf — see
  # capability_leaves.py::execution_leaves(), which excludes this category).
  config.engine.duckdb.s3_endpoint:
    support: supported
    hint: "S3-compatible endpoint override for CREATE SECRET (TYPE S3, ..., ENDPOINT ...) — the non-AWS escape hatch (MinIO, on-prem object storage). Verified end-to-end against a real MinIO instance."
    tests:
      - tests/test_executor_duckdb/test_engine_config.py::TestS3SecretResolution::test_resolve_s3_secret_from_config_includes_minio_overrides
      - tests/test_executor_duckdb/test_engine_config.py::TestS3SecretResolution::test_configure_s3_secret_with_minio_overrides_no_network
      - tests/test_executor_duckdb/test_s3_minio.py::TestDuckDBS3RoundTrip::test_duckdb_ingress_egress_round_trip_against_minio
  config.engine.duckdb.s3_url_style:
    support: supported
    hint: "URL_STYLE for CREATE SECRET (TYPE S3, ...) — MinIO and most non-AWS S3-compatible stores need 'path' rather than AWS's default virtual-hosted 'vhost' style. Verified end-to-end against a real MinIO instance."
    tests:
      - tests/test_executor_duckdb/test_engine_config.py::TestS3SecretResolution::test_resolve_s3_secret_from_config_includes_minio_overrides
      - tests/test_executor_duckdb/test_engine_config.py::TestS3SecretResolution::test_configure_s3_secret_with_minio_overrides_no_network
      - tests/test_executor_duckdb/test_s3_minio.py::TestDuckDBS3RoundTrip::test_duckdb_ingress_egress_round_trip_against_minio
  config.engine.duckdb.s3_use_ssl:
