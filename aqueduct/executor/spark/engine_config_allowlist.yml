# Spark's healing config-key allowlist — which `engine.spark.conf.<key>`
# entries the LLM's `set_engine_config` patch op may write, and the
# type/range each one must satisfy.
#
# WHY THIS FILE EXISTS: `engine.spark.conf` is a free-form dict[str, Any] —
# it carries NO capability leaf (aqueduct/executor/capability_leaves.py's
# _SCHEMA_BLOCKS never included SparkEngineBlockSchema), so the capability
# framework does not constrain it at all. This file is the only thing
# standing between the healing agent and an arbitrary Spark session-config
# key. See aqueduct/executor/engine_config_allowlist.py for the loader,
# validation contract, and the free-form-bag-vs-typed-fields addressing
# rule (this file, because SparkEngineBlockSchema declares a `conf` field,
# uses glob PATTERNS — an exact key with no `*`/`?` is just the exact-match
# special case).
#
# Rows below are grouped by the failure family the healing system prompt
# already claims to fix (aqueduct/executor/spark/prompt_rules.py + the
# generic scaffold in aqueduct/agent/prompts.py): shuffle partitioning,
# broadcast join threshold, executor/driver memory and overhead, adaptive
# execution, max result size, partition sizing, Kryo buffer.
#
# NO MAGNITUDE RANGES. A `range:` bound on a resource knob like
# spark.executor.memory would have to be a number core invents — this
# process has no access to the cluster a heal runs on, so `["128m","64g"]`
# both blocks a legitimate 96g heal on a large cluster and admits an
# absurd 64g heal on a laptop, wrong in both directions while reading as an
# authoritative bound. A bound core cannot derive is a bound core must not
# state. Every entry below therefore carries only a `type:` (a shape fact
# core CAN assert) — never a `range:`. `spark.driver.maxResultSize`'s old
# floor (excluding the `0` = unlimited sentinel) is real safety reasoning,
# not a magnitude guess, so it survives as a `deny_values` row below rather
# than a range; the old broadcast-threshold `1 GiB` cap was a DEPLOYMENT
# fact ("the sandbox was never sized for it"), not an engine fact, so it is
# simply gone — no replacement, deny or otherwise. The `range:`/`enum:`
# CAPABILITY itself stays fully supported by the loader/schema (see
# aqueduct/executor/engine_config_allowlist.py) for a future
# operator-narrowing feature; core just ships none today except
# `spark.serializer`'s `enum:`, which is a closed set of legal Spark
# serializer classes, not an invented magnitude.
#
# THE `deny:` SECTION BELOW IS THE ENFORCED VERSION of what used to be only
# a comment here. It is core-only and immutable — see the loader module's
# docstring ("Deny layer — core-only, immutable") for how that is encoded,
# not just stated. No `aqueduct.yml` key, `danger.` flag, or future
# extension may add to, shrink, or override it.

engine: spark
entries:
  # ── Shuffle partitioning ──────────────────────────────────────────────
  - pattern: spark.sql.shuffle.partitions
    type: int

  # ── Broadcast join threshold ──────────────────────────────────────────
  # Bytes; -1 disables broadcast joins entirely (a legitimate value, not a
  # safety bypass — it just turns a tuning knob off).
  - pattern: spark.sql.autoBroadcastJoinThreshold
    type: int

  # ── Executor / driver memory and overhead ─────────────────────────────
  - pattern: spark.executor.memory
    type: size
  - pattern: spark.driver.memory
    type: size
  - pattern: spark.executor.memoryOverhead
    type: size
  - pattern: spark.driver.memoryOverhead
    type: size

  # ── Adaptive query execution ───────────────────────────────────────────
  - pattern: spark.sql.adaptive.enabled
    type: bool
  # Covers spark.sql.adaptive.coalescePartitions.enabled and
  # spark.sql.adaptive.skewJoin.enabled in one glob family — both are the
  # same "toggle one AQE sub-feature" shape.
  - pattern: "spark.sql.adaptive.*.enabled"
    type: bool

  # ── Max result size ────────────────────────────────────────────────────
  # The `0` ("unlimited") sentinel is excluded via the `deny:` section
  # below, not a range floor — see that section's `maxResultSize` row.
  - pattern: spark.driver.maxResultSize
    type: size

  # ── Partition sizing ───────────────────────────────────────────────────
  - pattern: spark.sql.files.maxPartitionBytes
    type: size
  - pattern: spark.sql.adaptive.advisoryPartitionSizeInBytes
    type: size

  # ── Kryo serializer buffer ─────────────────────────────────────────────
  # spark.serializer itself is included as an enum (not a range) — the two
  # buffer keys above only take effect when Kryo is actually the active
  # serializer, so healing "buffer too small" sometimes means flipping this
  # too. Closed to the two built-in Spark serializer classes — not a
  # free-form class-name field (loading an arbitrary class name here would
  # be indistinguishable from the codegen/arbitrary-class-load footgun
  # AGENTS.md's UDF-body rule warns about).
  - pattern: spark.serializer
    type: str
    enum:
      - org.apache.spark.serializer.KryoSerializer
      - org.apache.spark.serializer.JavaSerializer
  - pattern: spark.kryoserializer.buffer
    type: size
  - pattern: spark.kryoserializer.buffer.max
    type: size

# ── CORE DENY LAYER ──────────────────────────────────────────────────────
# Structural enforcement of the exclusion families this file's comments
# used to only describe in prose. Every row needs a `reason:` (renders into
# the eventual patch-rejection message) and either bans its `pattern`
# outright, or — via `deny_values` — bans specific sentinel values on a key
# that otherwise stays allowed above. No `min`/`max` here: a bound is a
# range (Part 1's job), not a deny concern; discrete sentinels use
# `deny_values`. `load_allowlist()` refuses to load this file if any
# absolute-ban row above overlaps an allow entry — see the loader.
deny:
  # ── Family 1: placement — redirects where/how work runs ────────────────
  - pattern: "spark.master"
    reason: "redirects where work runs; a heal may not move the job"
  - pattern: "spark.submit.*"
    reason: "controls how/where the driver is submitted; a heal may not change job placement"
  - pattern: "spark.kubernetes.*"
    reason: "cluster-placement family"
  - pattern: "spark.yarn.*"
    reason: "cluster-placement family"
  - pattern: "spark.mesos.*"
    reason: "cluster-placement family"

  # ── Family 2: credentials / endpoints ───────────────────────────────────
  - pattern: "spark.hadoop.*"
    reason: "filesystem credential or endpoint configuration; not a knob a heal may rewrite"
  - pattern: "*.jars.repositories"
    reason: "artifact-repository/mirror URL; changing it can redirect where code is fetched from"

  # ── Family 3: safety-disable ────────────────────────────────────────────
  - pattern: "spark.ssl.*"
    reason: "TLS/encryption toggle; a heal may not disable a safety property"
  - pattern: "spark.network.crypto.*"
    reason: "wire-encryption toggle; a heal may not disable a safety property"
  - pattern: "spark.authenticate*"
    reason: "authentication toggle; a heal may not disable a safety property"
  - pattern: "spark.driver.maxResultSize"
    deny_values: ["0", 0]
    reason: "0 means unlimited; raising the cap is allowed, removing the guard is not"

  # ── Family 4: code loading — the no-arbitrary-code-execution moat ──────
  - pattern: "spark.jars"
    reason: "loads arbitrary JAR code onto the driver/executors"
  - pattern: "spark.jars.packages"
    reason: "resolves and loads arbitrary Maven coordinates onto the driver/executors"
  - pattern: "spark.files"
    reason: "ships arbitrary files onto the cluster"
  - pattern: "spark.submit.pyFiles"
    reason: "ships arbitrary Python code onto the cluster"
  - pattern: "spark.plugins"
    reason: "loads arbitrary driver/executor plugin code"
  - pattern: "spark.sql.extensions"
    reason: "loads arbitrary SQL-parser/planner extension code"
  - pattern: "spark.*.extraClassPath"
    reason: "extends the JVM classpath with arbitrary code"
  - pattern: "spark.*.extraJavaOptions"
    reason: "arbitrary JVM options, including -javaagent code injection"
  - pattern: "spark.*.extraLibraryPath"
    reason: "extends the native library search path with arbitrary code"
