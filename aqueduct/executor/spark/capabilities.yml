  healed_by.field.perf_baseline:
    support: supported
    hint: >-
      Warn-only perf-attribution provenance — recorded by core from run_records
      wall-clock time, no engine executes it. The input-volume proxy it carries
      comes from module_metrics, which the Spark executor writes for every
      module, so the note reports volume alongside duration on this engine.
  healed_by.field.perf_observations:
    support: supported
    hint: >-
      Warn-only perf-attribution provenance — recorded by core from run_records
      wall-clock time, no engine executes it. Reports an observed ratio only;
      Aqueduct sets no regression threshold and the note never blocks a run.
  healed_by.field.reverted_at:
    support: supported
    hint: >-
      Revert provenance — stamped by `aqueduct patch revert` and read only by
      core (the cross-engine compile gate and the green-run stamps in
      patch/apply.py). No Spark code path reads it, and a reverted record's
      engine-config write is already out of the Blueprint by the time a
      session is built.
