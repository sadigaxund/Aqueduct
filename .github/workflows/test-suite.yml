      - run: pip install -e ".[dev,llm,redis]"
      - run: |
          set +e
          pytest tests/test_typehub/ -m "not spark" --junitxml=results.xml
          rc=$?
          python scripts/ci-summary.py results.xml --name "TypeHub"
          exit $rc

  deploy-tests:
    needs: changes
    if: ${{ needs.changes.outputs.deploy == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Pip's DOWNLOAD cache only (~/.cache/pip) — never the installed env.
      # A stale/missing entry still re-resolves and re-verifies every
      # package; this only skips re-downloading wheels pip already has by
      # exact filename/hash, so it cannot change what version gets installed.
      # Same key as every other python-3.11 / ci-py311.txt job on purpose —
      # they share one dependency tree, so they should share one cache entry.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/ci-py311.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.11-
      - run: pip install -e ".[dev,llm,redis]"
      - run: |
          set +e
          pytest tests/test_deploy/ -m "not spark" --junitxml=results.xml
          rc=$?
          python scripts/ci-summary.py results.xml --name "Deploy"
          exit $rc

  # `tests/test_*.py` files with no dedicated subdirectory/lane of their own
  # (models, utils, lint, overrides, module_loading, airflow, backlog, and
  # the two meta-suites that police this repo's own test/CI honesty) — none
  # of them were referenced by path in ANY pre-merge job, so they only ever
  # ran post-merge (`coverage`, main-only) or at release time. Grouped here
  # the same way `config-tests` already groups its own loose top-level
  # files, rather than inventing a lane per file.
  misc-tests:
    needs: changes
    if: ${{ needs.changes.outputs.misc == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Pip's DOWNLOAD cache only (~/.cache/pip) — never the installed env.
      # A stale/missing entry still re-resolves and re-verifies every
      # package; this only skips re-downloading wheels pip already has by
      # exact filename/hash, so it cannot change what version gets installed.
      # Same key as every other python-3.11 / ci-py311.txt job on purpose —
      # they share one dependency tree, so they should share one cache entry.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/ci-py311.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.11-
      - run: pip install -e ".[dev,llm,redis]"
      - run: |
          set +e
          pytest tests/test_airflow.py tests/test_backlog.py tests/test_lint.py tests/test_meta_ci.py tests/test_meta_quality.py tests/test_models.py tests/test_module_loading.py tests/test_overrides.py tests/test_utils.py -m "not spark" --junitxml=results.xml
          rc=$?
          python scripts/ci-summary.py results.xml --name "Misc"
          exit $rc

  # ── Spark layer — needs local[1] via setup-java ──────────────────────

  executor-tests:
    needs: changes
    if: ${{ needs.changes.outputs.executor == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # Pip's DOWNLOAD cache only (~/.cache/pip) — never the installed env;
      # see the identical comment on the other jobs in this file.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements/ci-py311.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ matrix.python-version }}-
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      # Hudi/Iceberg bundles (tests/conftest.py::_LAKEHOUSE_COORDS) are Maven
      # artifacts pulled by Ivy at first SparkSession creation — slow, and
      # otherwise re-downloaded every run. Keyed on the pinned pyspark version
      # (ci-py311.txt) + the coordinate-selection logic itself, so a version
      # bump or a _HUDI_VER/_ICEBERG_VER edit invalidates it.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2
            ~/.m2
          key: ivy2-${{ runner.os }}-py3.11-${{ hashFiles('requirements/ci-py311.txt', 'tests/conftest.py') }}
          restore-keys: |
            ivy2-${{ runner.os }}-py3.11-
      # `duckdb` extra: tests/test_executor_duckdb/test_handoff_s3_minio.py
      # (added to this job below) is a genuinely cross-engine test — it
      # drives BOTH the Spark and DuckDB engines in the same process (via a
      # subprocess worker; see the file's own module docstring) to prove a
      # real handoff.root round-trip over MinIO.
      - run: pip install -e ".[dev,spark,llm,redis,duckdb]"
      # AQ_LAKEHOUSE lets conftest provision Hudi/Iceberg jars (Maven coords
      # derived from the installed pyspark version); tests self-skip for any
      # datasource with no build for this Spark line (e.g. Hudi on 3.3).
      #
      # Two pytest invocations, on purpose:
      #   1. `-m spark` over tests/test_executor/ + test_blueprints.py (as
      #      before) PLUS a handful of genuinely Spark-dependent files that
      #      live outside tests/test_executor/ (real `spark`/SparkSession
      #      fixture use, or a hard pyspark import) and would otherwise be
      #      excluded by every OTHER lane's `-m "not spark"` filter — see the
      #      `executor:` path-filter comment above for the list and why.
      #   2. `-m "not spark"` over tests/test_executor/ alone, for the
      #      `unit`-marked minority of that directory (pure-Python helpers,
      #      no Spark fixture) that invocation #1's `-m spark` deselects.
      #      This job is the ONLY pre-merge lane that ever points at
      #      tests/test_executor/, so without this second pass those
      #      unit-marked files ran in no pre-merge lane at all — the same
      #      test-selection gap this phase exists to close, just the mirror
      #      image (a unit test stranded in an all-Spark lane instead of a
      #      Spark test stranded in an all-unit one). See
      #      tests/test_meta_ci.py::test_every_test_file_is_selected_by_some_pre_merge_lane.
      - run: |
          set +e
          pytest tests/test_executor/ tests/test_compiler/test_blueprints.py tests/test_surveyor/test_probe.py tests/test_patch/test_patch_preview_gate3.py tests/test_patch/test_preview_sandbox_explain.py tests/test_sync_constants.py tests/test_executor_duckdb/test_handoff_s3_minio.py -m spark --junitxml=results.xml
          rc=$?
          python scripts/ci-summary.py results.xml --name "Executor"
          pytest tests/test_executor/ -m "not spark" --junitxml=results-unit.xml
          rc2=$?
          python scripts/ci-summary.py results-unit.xml --name "Executor (unit)"
          if [ $rc -ne 0 ]; then exit $rc; fi
          exit $rc2
        env:
          AQ_LAKEHOUSE: "1"

  # (The slow full-run `snippets` job moved to version-matrix.yml — snippets
  # are end-to-end compat checks, not per-push unit checks. They run there on
  # main pushes + workflow_dispatch; the fast `gallery-tests` guard below
  # still parse/compiles every example on branch pushes.)

  # ── Gallery guard — fast parse/compile/load of every shipped example ──
  # Complements the slow `snippets` full-run job: catches gallery rot in
  # seconds without executing 20 Spark pipelines. Needs Java for the
  # aqtest cases that run on a real local[1] Spark.

  gallery-tests:
    needs: changes
    if: ${{ needs.changes.outputs.gallery == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Pip's DOWNLOAD cache only (~/.cache/pip) — never the installed env.
      # A stale/missing entry still re-resolves and re-verifies every
      # package; this only skips re-downloading wheels pip already has by
      # exact filename/hash, so it cannot change what version gets installed.
      # Same key as every other python-3.11 / ci-py311.txt job on purpose —
      # they share one dependency tree, so they should share one cache entry.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/ci-py311.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.11-
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: pip install -e ".[dev,spark,llm]"
      - run: |
          set +e
          pytest tests/test_gallery.py --junitxml=results.xml
          rc=$?
          python scripts/ci-summary.py results.xml --name "Gallery"
          exit $rc

  # ── Store integration layer — needs PG + Redis ───────────────────────

  stores-tests:
    needs: changes
    if: ${{ needs.changes.outputs.stores == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: aq
          POSTGRES_PASSWORD: aq
          POSTGRES_DB: aq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Pip's DOWNLOAD cache only (~/.cache/pip) — never the installed env.
      # A stale/missing entry still re-resolves and re-verifies every
      # package; this only skips re-downloading wheels pip already has by
      # exact filename/hash, so it cannot change what version gets installed.
      # Same key as every other python-3.11 / ci-py311.txt job on purpose —
      # they share one dependency tree, so they should share one cache entry.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/ci-py311.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.11-
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: pip install -e ".[dev,spark,postgres,redis]"
      # No `-m integration` filter here, on purpose: this job is the ONLY
      # pre-merge lane that ever points at tests/test_stores/ / tests/test_depot/,
      # so a `unit`-marked test living in either directory (a mocked
      # dispatch-logic test, e.g. tests/test_stores/test_base.py — no real
      # Postgres/Redis touched) ran in NO pre-merge lane at all under the old
      # `-m integration`-only filter, same test-selection gap this phase
      # exists to close. Running the whole directory unfiltered is safe:
      # this job already has Postgres+Redis services up and the `spark`
      # extra installed, so the genuinely-integration and the one
      # Spark-marked test (test_phase33_matrix_postgres_redis) run for real,
      # and the unit-marked ones just run as plain fast tests alongside them.
      - name: Run Integration Tests
        env:
          AQ_PG_DSN: "postgresql://aq:aq@localhost:5432/aq_test"
          AQ_REDIS_URL: "redis://localhost:6379/15"
        run: |
          set +e
          pytest tests/test_stores/ tests/test_depot/ tests/test_benchmark_store.py --junitxml=results.xml
          rc=$?
          python scripts/ci-summary.py results.xml --name "Stores"
          exit $rc

  # ── Coverage — dedicated job, decoupled from Spark to avoid session flakiness ──
  # Runs the full suite under coverage with spark-marked tests DESELECTED
  # (-m "not spark") — the shared-session Spark fixture destabilises under
  # coverage tracing (~154 flaky Py4JJavaError failures vanish under --no-cov).
  # pyspark is still installed (see below): tests/test_cli/ and others import
  # pyspark or patch its internals at collection/setup time regardless of
  # marker, so without it installed those fail outright instead of being
  # cleanly deselected. -m "not spark" only controls which tests EXECUTE, not
  # whether pyspark is importable — installing it doesn't reintroduce the
  # session-fixture flakiness above, since spark-marked tests still never run.

  coverage:
    # main-only (post-merge) + manual — the pre-merge PR run was the same
    # suite twice; branch pushes already prove the code, coverage gates main.
    # Needs Java + the spark extra (like cli-tests/executor-tests) — tests/test_cli/
    # is scanned here too (no path filter) and is not actually pure-Python:
    # dozens of its tests invoke real CLI paths or patch pyspark internals
    # directly, so without pyspark installed collection/setup fails outright
    # rather than being cleanly deselected by -m "not spark".
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Pip's DOWNLOAD cache only (~/.cache/pip) — never the installed env.
      # A stale/missing entry still re-resolves and re-verifies every
      # package; this only skips re-downloading wheels pip already has by
      # exact filename/hash, so it cannot change what version gets installed.
      # Same key as every other python-3.11 / ci-py311.txt job on purpose —
      # they share one dependency tree, so they should share one cache entry.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/ci-py311.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.11-
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      # `duckdb` extra pulls numpy, required by tests/test_executor_duckdb/
      # (conn.create_function() — see pyproject.toml's [duckdb] extra
      # comment). This job scans the whole suite with no path filter, so it
      # hits those tests too.
      - run: pip install -e ".[dev,spark,llm,redis,stores,duckdb]"
      - run: |
          set +e
          pytest --cov=aqueduct --cov-report=term-missing --cov-fail-under=68 -m "not spark" --junitxml=results.xml
          rc=$?
          python scripts/ci-summary.py results.xml --name "Coverage"
          exit $rc
