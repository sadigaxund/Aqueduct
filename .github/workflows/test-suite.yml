name: Test Suite

# Trigger design (2026-07-03): branch pushes prove the SHA; the PR to main
# re-ran the identical suite on the identical commit, so the pull_request
# trigger was dropped. main is in the push list so post-merge skew is still
# caught (and that's where coverage runs). Revisit if external contributors
# arrive (fork PRs would need the pull_request trigger back).
on:
  push:
    branches: [feat/**, phase/**, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

# ENVIRONMENT LOCK (Phase 78). Every job in this workflow runs on python 3.11 and
# is a REPRODUCIBLE lane: it must install the same dependency tree today and in six
# months, not whatever PyPI published this morning. pip reads $PIP_CONSTRAINT for
# every `pip install` below, so no install line changes — the constraints file only
# fixes the version of what the pyproject RANGES resolve to (the ranges stay ranges;
# aqueduct-core is a published library and must not pin). Regenerate the file with
# `bash scripts/lock.sh`.
#
# The unpinned CANARY lane lives in version-matrix.yml (`snippets`) and deliberately
# does NOT set this — see the comments there before touching it.
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/requirements/ci-py311.txt

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      parser:    ${{ steps.filter.outputs.parser }}
      compiler:  ${{ steps.filter.outputs.compiler }}
      executor:  ${{ steps.filter.outputs.executor }}
      surveyor:  ${{ steps.filter.outputs.surveyor }}
      agent:     ${{ steps.filter.outputs.agent }}
      patch:     ${{ steps.filter.outputs.patch }}
      stores:    ${{ steps.filter.outputs.stores }}
      cli:       ${{ steps.filter.outputs.cli }}
      config:    ${{ steps.filter.outputs.config }}
      gallery:   ${{ steps.filter.outputs.gallery }}
      drift:     ${{ steps.filter.outputs.drift }}
      tui:       ${{ steps.filter.outputs.tui }}
      tools:     ${{ steps.filter.outputs.tools }}
      mcp:       ${{ steps.filter.outputs.mcp }}
      capabilities: ${{ steps.filter.outputs.capabilities }}
      duckdb:    ${{ steps.filter.outputs.duckdb }}
      typehub:   ${{ steps.filter.outputs.typehub }}
      deploy:    ${{ steps.filter.outputs.deploy }}
      misc:      ${{ steps.filter.outputs.misc }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            parser:
              - 'aqueduct/parser/**'
              - 'tests/test_parser/**'
            compiler:
              - 'aqueduct/compiler/**'
              - 'tests/test_compiler/**'
            executor:
              - 'aqueduct/executor/**'
              - 'tests/test_executor/**'
              - 'tests/test_compiler/test_blueprints.py'
              # Genuinely Spark-dependent tests that live OUTSIDE tests/test_executor/
              # (real SparkSession fixture, or a hard pyspark import) — the
              # executor-tests job below is the only lane that runs them; see
              # its own comment for why they can't just live under
              # -m "not spark" in their home directory's own lane.
              - 'tests/test_surveyor/test_probe.py'
              - 'tests/test_patch/test_patch_preview_gate3.py'
              - 'tests/test_patch/test_preview_sandbox_explain.py'
              - 'tests/test_sync_constants.py'
              - 'tests/test_executor_duckdb/test_handoff_s3_minio.py'
            surveyor:
              - 'aqueduct/surveyor/**'
              - 'aqueduct/infra/**'
              - 'tests/test_surveyor/**'
            agent:
              - 'aqueduct/agent/**'
              - 'aqueduct/infra/**'
              - 'tests/test_agent/**'
            patch:
              - 'aqueduct/patch/**'
              - 'tests/test_patch/**'
            stores:
              - 'aqueduct/stores/**'
              - 'tests/test_stores/**'
              - 'tests/test_depot/**'
            cli:
              - 'aqueduct/cli/**'
              - 'aqueduct/dev/**'
              - 'tests/test_cli/**'
            config:
              - 'aqueduct/config.py'
              - 'aqueduct/redaction.py'
              - 'aqueduct/secrets.py'
              - 'aqueduct/warnings.py'
              - 'tests/test_config.py'
              - 'tests/test_parser/test_config.py'
              - 'tests/test_redaction.py'
              - 'tests/test_secrets.py'
              - 'tests/test_warnings.py'
            gallery:
              - 'gallery/**'
              - 'tests/test_gallery.py'
              - 'aqueduct/parser/**'
              - 'aqueduct/compiler/**'
            drift:
              - 'aqueduct/drift/**'
              - 'tests/test_drift/**'
            tui:
              - 'aqueduct/tui/**'
              - 'tests/test_tui/**'
            tools:
              - 'aqueduct/tools/**'
              - 'aqueduct/stores/**'
              - 'aqueduct/doctor/**'
              - 'tests/test_tools/**'
            mcp:
              - 'aqueduct/mcp/**'
              - 'aqueduct/tools/**'
              - 'tests/test_mcp/**'
            capabilities:
              - 'aqueduct/executor/capabilities.py'
              - 'aqueduct/executor/capability_leaves.py'
              - 'aqueduct/executor/capability_tooling.py'
              - 'aqueduct/executor/config_leaves.py'
              - 'aqueduct/executor/channel_ops.py'
              - 'aqueduct/executor/spark/capabilities.py'
              - 'aqueduct/executor/duckdb_/capabilities.py'
              - 'aqueduct/cli/dev.py'
              - 'aqueduct/compiler/capability_check.py'
              - 'aqueduct/config.py'
              - 'aqueduct/errors.py'
              - 'aqueduct/doctor/**'
              - 'tests/test_capabilities/**'
            duckdb:
              - 'aqueduct/executor/duckdb_/**'
              - 'tests/test_executor_duckdb/**'
            typehub:
              - 'aqueduct/typehub.py'
              - 'tests/test_typehub/**'
            deploy:
              - 'aqueduct/deploy/**'
              - 'tests/test_deploy/**'
            misc:
              - 'aqueduct/models.py'
              - 'aqueduct/utils.py'
              - 'aqueduct/lint.py'
              - 'aqueduct/overrides.py'
              - 'aqueduct/infra/module_loading.py'
              - 'aqueduct/integrations/airflow/**'
              - 'aqueduct/executor/capabilities.py'
              - '.github/workflows/**'
              - 'requirements/**'
              - 'pyproject.toml'
              - 'tests/test_airflow.py'
              - 'tests/test_backlog.py'
              - 'tests/test_lint.py'
              - 'tests/test_meta_ci.py'
              - 'tests/test_meta_quality.py'
              - 'tests/test_models.py'
              - 'tests/test_module_loading.py'
              - 'tests/test_overrides.py'
              - 'tests/test_utils.py'

  # ── Unit-test layer — fast, no Spark needed ──────────────────────────

  parser-tests:
    needs: changes
    if: ${{ needs.changes.outputs.parser == 'true' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      # Pip's DOWNLOAD cache only (~/.cache/pip) — never the installed env.
      # A stale/missing entry still re-resolves and re-verifies every
      # package; this only skips re-downloading wheels pip already has by
      # exact filename/hash, so it cannot change what version gets installed.
      # Same key as every other python-3.11 / ci-py311.txt job on purpose —
      # they share one dependency tree, so they should share one cache entry.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements/ci-py311.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py3.11-
      - run: pip install -e ".[dev,llm,redis,postgres]"
      - run: |
          set +e
          pytest tests/test_parser/ -m "not spark" --junitxml=results.xml
          rc=$?
          python scripts/ci-summary.py results.xml --name "Parser"
          exit $rc

